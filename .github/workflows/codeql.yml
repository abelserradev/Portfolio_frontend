name: CodeQL

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]
  schedule:
    - cron: "35 5 * * 2"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar pnpm
        uses: pnpm/action-setup@41ff72659bfc88ef2238175a2c013b6f1a1c305 # v4.2.0
        with:
          version: 10.12.4

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@14c9a0cbe6373488c2a41f7e75c8dd142bb2aba8 # v3.35.3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@14c9a0cbe6373488c2a41f7e75c8dd142bb2aba8 # v3.35.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@14c9a0cbe6373488c2a41f7e75c8dd142bb2aba8 # v3.35.3
        with:
          category: "/language:javascript"
