# Validación en GitHub: calidad + deps. El despliegue lo orquesta Coolify (rama de producción configurada allí).
# TODO: Si next build exige variables obligatorias sin default, añadir env: con secrets de repo o valores placeholder de CI.
name: CI

on:
  push:
    branches: [main, develop, desarrollo]
  pull_request:
    branches: [main, develop, desarrollo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-front-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-audit:
    name: Lint, build y pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.4

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: ESLint
        run: pnpm run lint

      - name: Vitest
        run: pnpm run test

      - name: Build Next.js
        run: pnpm run build

      - name: pnpm audit (falla en alto o crítico)
        run: pnpm audit --audit-level=high
