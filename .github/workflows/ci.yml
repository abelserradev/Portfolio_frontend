# Validación en GitHub: calidad + deps. El despliegue lo orquesta Coolify (rama de producción configurada allí).
# TODO: Si next build exige variables obligatorias sin default, añadir env: con secrets de repo o valores placeholder de CI.
name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-front-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-audit:
    name: Lint, build y pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.4

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: ESLint
        run: pnpm run lint

      - name: Build Next.js
        run: pnpm run build

      - name: pnpm audit (falla en alto o crítico)
        run: pnpm audit --audit-level=high
